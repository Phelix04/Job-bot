name: Job Check

on:
  schedule:
    # Runs every 2 hours (GitHub Actions uses UTC time).
    - cron: "0 */2 * * *"
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab, for testing.

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.json from secrets
        run: |
          python - <<'EOF'
          import json
          with open("config.json") as f:
              config = json.load(f)
          config["telegram_bot_token"] = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          config["telegram_chat_id"] = "${{ secrets.TELEGRAM_CHAT_ID }}"
          with open("config.json", "w") as f:
              json.dump(config, f, indent=2)
          EOF

      - name: Run job bot
        run: python main.py

      - name: Restore config.json placeholders before commit
        run: |
          python - <<'EOF'
          import json
          with open("config.json") as f:
              config = json.load(f)
          config["telegram_bot_token"] = "PASTE_YOUR_BOTFATHER_TOKEN_HERE"
          config["telegram_chat_id"] = "PASTE_YOUR_CHAT_ID_HERE"
          with open("config.json", "w") as f:
              json.dump(config, f, indent=2)
          EOF

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
